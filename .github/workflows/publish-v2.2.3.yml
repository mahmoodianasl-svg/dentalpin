name: Publish v2.2.3 once

on:
  push:
    branches:
      - release/v2.2.3

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify exact release target and create tag
        env:
          EXPECTED_SHA: 548c096d2ce244f1869da505d3d0f19fc4162f2c
          RELEASE_TAG: v2.2.3
        run: |
          git fetch origin main --tags
          ACTUAL_SHA="$(git rev-parse origin/main)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::main moved: expected $EXPECTED_SHA, found $ACTUAL_SHA"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::$RELEASE_TAG already exists"
            exit 1
          fi
          git tag "$RELEASE_TAG" "$EXPECTED_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Dispatch the existing release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref main -f tag=v2.2.3

      - name: Remove one-time publisher from release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v2.2.3.yml
          git commit -m "chore(release): remove one-time v2.2.3 publisher"
          git push origin HEAD:release/v2.2.3
