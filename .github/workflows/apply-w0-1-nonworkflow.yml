name: Apply W0.1 non-workflow patch

on:
  push:
    branches:
      - agent/w0-1-reproducible-baseline
    paths:
      - .w0/w0_1_nonworkflow.patch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/w0-1-reproducible-baseline
          fetch-depth: 0

      - name: Verify and apply reviewed patch
        run: |
          git apply --check .w0/w0_1_nonworkflow.patch
          git apply .w0/w0_1_nonworkflow.patch
          rm .w0/w0_1_nonworkflow.patch
          rmdir .w0 2>/dev/null || true

      - name: Commit W0.1 non-workflow changes
        run: |
          git config user.name 'DentalPin W0.1 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --name-only | tee /tmp/changed.txt
          if grep -q '^\.github/workflows/' /tmp/changed.txt; then
            echo '::error::Patch unexpectedly touched workflow files.'
            exit 1
          fi
          git commit -m 'build: establish reproducible runtime baseline'
          git push origin HEAD:agent/w0-1-reproducible-baseline
