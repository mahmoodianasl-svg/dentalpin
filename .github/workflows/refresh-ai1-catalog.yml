name: Refresh AI-1 catalogs

on:
  push:
    branches:
      - feature/ai1-patient-realtime-agent
    paths:
      - '.github/workflows/refresh-ai1-catalog.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/ai1-patient-realtime-agent
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.15'
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Generate catalogs
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: ci-stub
          ENVIRONMENT: test
          TESTING: 'true'
        run: python backend/scripts/generate_catalogs.py
      - name: Remove one-shot workflow and commit generated catalogs
        run: |
          rm .github/workflows/refresh-ai1-catalog.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/modules-catalog.md docs/events-catalog.md .github/workflows/refresh-ai1-catalog.yml
          git diff --cached --quiet || git commit -m 'docs(ai1): refresh generated catalogs'
          git push origin HEAD:feature/ai1-patient-realtime-agent
