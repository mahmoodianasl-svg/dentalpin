name: Wave 0.2 Schema Parity

# Revalidate the resolved W0.2 stack against main after W0.1 integration.

on:
  push:
    branches: [agent/w0-2-schema-parity]
  pull_request:
    branches: [agent/w0-1-reproducible-baseline, main]

permissions:
  contents: read

jobs:
  migrated-schema-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dental_schema_parity
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/dental_schema_parity
      SECRET_KEY: w0-2-schema-parity-ci
      ENVIRONMENT: test
      TESTING: "true"
      MIGRATED_SCHEMA_PARITY: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.15"
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint W0.2 schema controls
        working-directory: backend
        run: ruff check app/schema_registry.py tests/test_schema_parity.py tests/test_payment_integrity_schema.py tests/test_alembic_roundtrip.py
      - name: Verify irreversible migration inventory
        working-directory: backend
        run: >-
          python -m pytest -m alembic_roundtrip
          tests/test_alembic_roundtrip.py::test_one_way_revision_inventory_is_complete
          -v --tb=short
      - name: Migrate fresh PostgreSQL database to all heads
        working-directory: backend
        run: alembic upgrade heads
      - name: Compare migrated schema with complete SQLAlchemy metadata
        working-directory: backend
        run: python -m pytest -m schema_parity tests/test_schema_parity.py tests/test_payment_integrity_schema.py -v --tb=short
      - name: Verify PostgreSQL backup and restore
        run: |
          set -euo pipefail
          export PGPASSWORD=testpass

          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:15-alpine \
            pg_dump -h 127.0.0.1 -U dental -d dental_schema_parity -Fc \
            > /tmp/dental-w0-2.dump

          test -s /tmp/dental-w0-2.dump

          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:15-alpine \
            psql -h 127.0.0.1 -U dental -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS dental_schema_restore" \
            -c "CREATE DATABASE dental_schema_restore OWNER dental"

          docker run --rm --network host -i \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:15-alpine \
            pg_restore -h 127.0.0.1 -U dental -d dental_schema_restore --exit-on-error \
            < /tmp/dental-w0-2.dump

          source_heads="$(docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" postgres:15-alpine \
            psql -h 127.0.0.1 -U dental -d dental_schema_parity -Atc \
            'SELECT version_num FROM alembic_version ORDER BY version_num')"
          restore_heads="$(docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" postgres:15-alpine \
            psql -h 127.0.0.1 -U dental -d dental_schema_restore -Atc \
            'SELECT version_num FROM alembic_version ORDER BY version_num')"
          test -n "$source_heads"
          test "$source_heads" = "$restore_heads"
      - name: Verify restored database schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/dental_schema_restore
        run: python -m pytest -m schema_parity tests/test_schema_parity.py tests/test_payment_integrity_schema.py -v --tb=short

  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dental_clinic_test
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/dental_clinic_test
      SECRET_KEY: w0-2-backend-regression
      ENVIRONMENT: test
      TESTING: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.15"
      - name: Verify W0.1 dependency baseline remains unchanged
        run: python scripts/check_wave0_1_baseline.py --strict
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Backend lint
        run: ruff check backend/
      - name: Backend format gate
        run: ruff format --check backend/
      - name: Run default backend test suite
        working-directory: backend
        run: python -m pytest --ignore=tests/test_schema_parity.py -v --tb=short
      - name: Run Alembic round-trip suite
        working-directory: backend
        run: python -m pytest -v -m alembic_roundtrip --tb=short
      - name: Verify docs layout
        run: python scripts/check_docs_layout.py
