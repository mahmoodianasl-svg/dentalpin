name: Refresh AI-0 catalogs once

on:
  push:
    branches:
      - feature/ai-realtime-foundation

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/ai-realtime-foundation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.15'
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Generate catalogs
        run: python backend/scripts/generate_catalogs.py
      - name: Commit generated catalogs and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-ai0-catalogs.yml
          git add docs/modules-catalog.md docs/events-catalog.md
          git commit -m "docs(ai): refresh module catalogs"
          git push origin HEAD:feature/ai-realtime-foundation
