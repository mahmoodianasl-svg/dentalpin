name: Bootstrap audited DentalPin W0.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-w0-1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    if: github.repository == 'mahmoodianasl-svg/dentalpin'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited upstream commit
        uses: actions/checkout@v5
        with:
          repository: martinezsalmeron/dentalpin
          ref: 3cc3a477d88607845ef7e9a960ba6ea9a8ecd7c1
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name 'DentalPin W0.1 Automation'
          git config user.email 'actions@users.noreply.github.com'

      - name: Seed fork main from audited commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin 3cc3a477d88607845ef7e9a960ba6ea9a8ecd7c1:refs/heads/main

      - name: Create W0.1 branch and apply reviewed patch
        run: |
          git switch -c agent/w0-1-reproducible-baseline
          cat > /tmp/w0.patch.b64 <<'PATCH_B64'
          ZGlmZiAtcnVOICctLWV4Y2x1ZGU9X19weWNhY2hlX18nICctLWV4Y2x1ZGU9Ki5weWMnIC9tbnQvZGF0YS9kZW50YWxwaW5fd2F2ZTBfMV9jbGVh
