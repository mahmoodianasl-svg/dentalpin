name: Bootstrap audited DentalPin baseline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-w0-1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed-main:
    if: github.repository == 'mahmoodianasl-svg/dentalpin'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact audited upstream commit
        uses: actions/checkout@v5
        with:
          repository: martinezsalmeron/dentalpin
          ref: 3cc3a477d88607845ef7e9a960ba6ea9a8ecd7c1
          fetch-depth: 0

      - name: Seed fork main from audited commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin 3cc3a477d88607845ef7e9a960ba6ea9a8ecd7c1:refs/heads/main
