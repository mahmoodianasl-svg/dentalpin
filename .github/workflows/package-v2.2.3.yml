name: Package v2.2.3 once

on:
  push:
    branches:
      - release/v2.2.3

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v5
        with:
          ref: v2.2.3
          fetch-depth: 0
          path: source

      - name: Build final source package
        env:
          RELEASE_TAG: v2.2.3
          RELEASE_SHA: 548c096d2ce244f1869da505d3d0f19fc4162f2c
        run: |
          mkdir -p package/dentalpin-v2.2.3
          cp -a source/. package/dentalpin-v2.2.3/
          rm -rf package/dentalpin-v2.2.3/.git
          cat > package/dentalpin-v2.2.3/RELEASE_INFO.txt <<'EOF'
          DentalPin final source package
          Version: v2.2.3
          Commit: 548c096d2ce244f1869da505d3d0f19fc4162f2c
          Release: https://github.com/mahmoodianasl-svg/dentalpin/releases/tag/v2.2.3
          Backend image: ghcr.io/mahmoodianasl-svg/dentalpin-backend:2.2.3
          Frontend image: ghcr.io/mahmoodianasl-svg/dentalpin-frontend:2.2.3
          Architectures: linux/amd64, linux/arm64
          EOF
          cd package
          zip -qr ../dentalpin-v2.2.3-final.zip dentalpin-v2.2.3
          cd ..
          sha256sum dentalpin-v2.2.3-final.zip > SHA256SUMS.txt
          unzip -tq dentalpin-v2.2.3-final.zip

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: dentalpin-v2.2.3-final-package
          path: |
            dentalpin-v2.2.3-final.zip
            SHA256SUMS.txt
          retention-days: 7

      - name: Checkout release branch for cleanup
        uses: actions/checkout@v5
        with:
          ref: release/v2.2.3
          path: cleanup

      - name: Remove one-time packaging workflow
        run: |
          cd cleanup
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/package-v2.2.3.yml
          git commit -m "chore(release): remove one-time v2.2.3 packager"
          git push origin HEAD:release/v2.2.3
